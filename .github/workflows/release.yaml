name: Release to GitHub Packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Override settings.xml for plugin resolution
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: '[{ "id": "github", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}" }]'
          plugin_repositories: '[{ "id": "github", "url": "https://maven.pkg.github.com/Redhawk-Federal/*" }]'

      - name: Start OTEL collector
        run: docker run -d -p 127.0.0.1:4317:4317 --name collector otel/opentelemetry-collector:0.98.0

      - name: Publish to GitHub Packages
        run: mvn --batch-mode --no-transfer-progress deploy -Dlicense.skip=true -Darchetype.test.skip=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop OTEL collector
        if: always()
        run: docker stop collector && docker rm collector
