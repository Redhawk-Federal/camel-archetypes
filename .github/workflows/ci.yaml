name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    # skip releases
    if: startsWith(github.ref, '[maven-release-plugin] prepare release') != true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Override/recreate settings.xml
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: '[{ "id": "github", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}" }]'
          plugin_repositories: '[{ "id": "github", "url": "https://maven.pkg.github.com/Redhawk-Federal/*" }]'
      - name: mvn clean verify
        env:
          GH_USERNAME: "${{ github.actor }}"
          GH_PAT: "${{ secrets.GITHUB_TOKEN }}"
        run: ./mvnw -V --no-transfer-progress --batch-mode clean verify
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Override settings.xml for plugin resolution
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: '[{ "id": "github", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}" }]'
          plugin_repositories: '[{ "id": "github", "url": "https://maven.pkg.github.com/Redhawk-Federal/*" }]'
      - name: Deploy snapshot to GitHub Packages
        run: ./mvnw --batch-mode --no-transfer-progress -Dlicense.skip=true -DskipTests -Darchetype.test.skip=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}